name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # ★ 播放专项阶段1 · A4 验证(1)：插件依赖安装
      - name: Verify native plugin installed
        shell: bash
        run: |
          set -euo pipefail
          echo "== 检查本地插件依赖 =="
          PLUGIN=node_modules/media3-player
          if [ ! -d "$PLUGIN" ]; then echo "❌ media3-player 未安装"; exit 1; fi
          echo "--- 插件目录 ---"
          ls -la "$PLUGIN"
          if [ ! -f "$PLUGIN/android/build.gradle" ]; then
            echo "❌ 插件 android/build.gradle 缺失"
            echo "--- 插件目录完整结构 ---"
            find "$PLUGIN" -maxdepth 5 | sort
            echo "--- npm 版本 ---"; npm --version
            echo "--- 源目录是否有 build.gradle ---"
            ls -la native-plugins/media3-player/android/ || true
            exit 1
          fi
          KT="$PLUGIN/android/src/main/java/com/giangnam728828/anime/universe/player/Media3PlayerPlugin.kt"
          if [ ! -f "$KT" ]; then echo "❌ Kotlin 插件源缺失"; find "$PLUGIN/android" -name '*.kt'; exit 1; fi
          echo "✅ media3-player 依赖安装正确"

      # ★ 播放专项阶段1：测试视频有效性验证（用户裁定）
      #   必须确认存在可解码视频帧+音轨，不能是只有容器结构的空 MP4
      - name: Verify test video is decodable
        shell: bash
        run: |
          set -euo pipefail
          echo "== 测试视频验证 =="
          python3 scripts/verify_test_video.py \
            native-plugins/media3-player/android/src/main/assets/test.mp4
          python3 scripts/verify_test_video.py \
            public/player-test/test.mp4
          echo "--- SHA256 ---"
          sha256sum native-plugins/media3-player/android/src/main/assets/test.mp4

      - name: Inject embedded translation key
        env:
          TRANS_API_KEY: ${{ secrets.TRANS_API_KEY }}
        run: |
          if [ -n "$TRANS_API_KEY" ]; then
            printf '// Auto-injected at build time from GitHub Secrets.\nexport const EMBEDDED_TRANS_KEY = "%s"\n' "$TRANS_API_KEY" > src/services/translate/embedded.ts
            echo "translation key injected"
          else
            echo "no TRANS_API_KEY secret, keep placeholder"
          fi

      - name: Build web assets
        run: npm run build

      - name: Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # ★ 播放专项阶段1 · A4 验证(1)：插件自动注册
      - name: Verify plugin auto-registration
        run: |
          echo "== 检查 Capacitor 自动注册 =="
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -f "$PLUGINS" || (echo "❌ capacitor.plugins.json 不存在"; exit 1)
          echo "--- capacitor.plugins.json ---"
          cat "$PLUGINS"
          grep -q "media3-player" "$PLUGINS" \
            || (echo "❌ Media3Player 未出现在自动注册清单"; exit 1)
          grep -q "Media3PlayerPlugin" "$PLUGINS" \
            || (echo "❌ Media3PlayerPlugin 类未注册"; exit 1)
          echo "✅ Media3Player 已自动注册"
          echo "== 检查 Kotlin 源已进入 Android 工程 =="
          find android -name "Media3PlayerPlugin.kt" | head -5
          find android -name "PlayerActivity.kt" | head -5

      - name: Generate anime app icons & splash
        run: |
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android \
              --assetPath assets \
              --iconBackgroundColor "#0A0A0F" \
              --splashBackgroundColor "#0A0A0F"
          fi

      - name: Setup fixed signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore.p12
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore.p12
          storePassword=$KEYSTORE_PASSWORD
          storeType=PKCS12
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          python3 scripts/patch_signing.py "${{ github.run_number }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ★ 播放专项阶段1：注入 Kotlin Gradle Plugin（Capacitor 6 模板默认不含）
      - name: Inject Kotlin Gradle Plugin
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path('android/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'kotlin-gradle-plugin' in s:
              print('已注入，跳过')
              raise SystemExit(0)
          # 在 buildscript.dependencies 中加入 kotlin plugin classpath
          # ★ Media3 1.11.1 要求 minCompileSdk=36；AGP 8.2.1 最高支持 34
          #   故升级 AGP 8.2.1 -> 8.7.3（支持 compileSdk 36）
          s = re.sub(
              r"classpath 'com\.android\.tools\.build:gradle:[0-9.]+'",
              "classpath 'com.android.tools.build:gradle:8.7.3'",
              s,
          )
          s = s.replace(
              "classpath 'com.android.tools.build:gradle:8.7.3'",
              "classpath 'com.android.tools.build:gradle:8.7.3'\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'",
              1,
          )
          p.write_text(s, encoding='utf-8')
          print('✅ Kotlin Gradle Plugin 已注入')
          PYEOF
          echo "--- 验证 ---"
          grep -n "kotlin-gradle-plugin" android/build.gradle

          # ★ 强制对齐 kotlin-stdlib 版本（AGP 传递版本与 kotlin 编译器需一致）
          if ! grep -q resolutionStrategy android/build.gradle; then
            echo '' | base64 -d >> android/build.gradle
            echo "✅ kotlin-stdlib 已强制对齐到 2.2.10"
          else
            echo "已对齐，跳过"
          fi
          tail -12 android/build.gradle

          # 把插件作为独立 module 引入
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/settings.gradle')
          s = p.read_text(encoding='utf-8')
          if "media3-player" in s:
              print('module 已引入，跳过')
              raise SystemExit(0)
          s = s.rstrip() + "\n\n// ★ 播放专项阶段1：本地 Media3 插件 module\n" \
              + "include ':media3-player'\n" \
              + "project(':media3-player').projectDir = new File(rootDir, '../node_modules/media3-player/android')\n"
          p.write_text(s, encoding='utf-8')
          print('✅ media3-player module 已引入 settings.gradle')
          PYEOF
          tail -5 android/settings.gradle

          # app 依赖该 module
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if "media3-player" in s:
              print('依赖已存在，跳过')
              raise SystemExit(0)
          s = s.rstrip() + "\n\ndependencies {\n    implementation project(':media3-player')\n}\n"
          p.write_text(s, encoding='utf-8')
          print('✅ app 已依赖 :media3-player')
          PYEOF

          # minSdk 22 -> 23（用户 A1 裁定）
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path('android/variables.gradle')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'minSdkVersion\s*=\s*22', 'minSdkVersion = 23', s)
          # ★ Media3 1.11.1 AAR 元数据要求 minCompileSdk=36
          # ★ 仅 compileSdk 升 36（Media3 1.11.1 AAR 要求 minCompileSdk=36）
          #   targetSdk 保持 34（用户裁定，与 Media3 要求无关）
          s2 = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s2)
          # targetSdk 恢复为 34（用户裁定）
          s2 = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 34', s2)
          p.write_text(s2, encoding='utf-8')
          print('✅ minSdk 23, compileSdk 36, targetSdk 34')
          PYEOF
          grep -nE "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle

      - name: Upgrade Gradle wrapper for AGP 8.7
        run: |
          cd android
          # AGP 8.7.3 需要 Gradle 8.9+
          sed -i 's|gradle-8.2.1-all.zip|gradle-8.9-all.zip|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # ★ 播放专项阶段1 · T1-F / T1-G：真实 Kotlin JVM 单元测试
      #   ★ 这些是在 JVM 上真实执行 PlaybackUriValidator / PlaybackErrorMapper，
      #     不是等价移植测试。
      - name: Run Kotlin unit tests (T1-F / T1-G)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :media3-player:testDebugUnitTest --no-daemon --info

      - name: Report Kotlin unit test results (T1-F / T1-G)
        if: always()
        run: |
          echo "== T1-F / T1-G Kotlin 单元测试结果 =="
          python3 - <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob(
              'android/media3-player/build/test-results/testDebugUnitTest/*.xml'
          ) + glob.glob(
              'android/**/media3-player/build/test-results/testDebugUnitTest/*.xml'
          ) + glob.glob(
              '**/media3-player/build/test-results/testDebugUnitTest/*.xml'
          )
          files = sorted(set(files))
          if not files:
              print('❌ 未找到测试结果 XML —— Kotlin 单元测试未执行')
              sys.exit(1)

          total = fail = err = skip = 0
          for f in files:
              root = ET.parse(f).getroot()
              t = int(root.get('tests', 0)); fl = int(root.get('failures', 0))
              e = int(root.get('errors', 0)); sk = int(root.get('skipped', 0))
              total += t; fail += fl; err += e; skip += sk
              status = '✅' if (fl == 0 and e == 0) else '❌'
              print(f'{status} {root.get("name")}: tests={t} failures={fl} errors={e} skipped={sk}')
              for tc in root.iter('testcase'):
                  bad = tc.find('failure') is not None or tc.find('error') is not None
                  print(f'     {"❌" if bad else "✅"} {tc.get("name")}')

          print(f'\n汇总: 共 {total} 项, 失败 {fail}, 错误 {err}, 跳过 {skip}')
          if fail or err:
              print('❌ Kotlin 单元测试未全部通过')
              sys.exit(1)
          if total == 0:
              print('❌ 测试数为 0，视为未验证')
              sys.exit(1)
          print('✅ T1-F / T1-G Kotlin 单元测试全部通过（真实 JVM 执行）')
          PYEOF

      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-reports
          path: '**/media3-player/build/reports/tests/testDebugUnitTest/**'
          if-no-files-found: warn

      - name: Build Release APK (fixed signature)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon


      # ★ 播放专项阶段1 · A4 验证(2)：原生构建产物验证
      - name: Verify native build artifacts
        run: |
          echo "== 检查 Media3 依赖进入构建 =="
          test -f android/app/build/outputs/apk/release/app-release.apk \
            || (echo "❌ APK 未生成"; exit 1)
          echo "== 检查 APK 内包含插件类 =="
          python3 - <<'PYEOF'
          import zipfile, sys
          z = zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk')
          names = z.namelist()
          dex = [n for n in names if n.endswith('.dex')]
          print(f'dex 文件数: {len(dex)}')
          # 检查 assets 中的测试素材
          assets = [n for n in names if 'test.mp4' in n]
          print(f'测试素材: {assets if assets else "未找到"}')
          # 用 strings 方式在 dex 里找插件类名
          found = False
          for n in dex:
              data = z.read(n)
              if b'Media3PlayerPlugin' in data or b'PlayerActivity' in data:
                  found = True
                  break
          if not found:
              print('❌ dex 中未找到 Media3PlayerPlugin / PlayerActivity')
              sys.exit(1)
          print('✅ 插件类已编入 dex')
          PYEOF
          echo "== 检查 APK minSdkVersion =="
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BT}aapt2" dump badging \
            android/app/build/outputs/apk/release/app-release.apk | grep -E "sdkVersion|targetSdkVersion" || true

          # ★ 合并后 Manifest 必须真正包含 PlayerActivity（AXML 解析，非字节匹配）
          echo "== 检查合并后的 Manifest 含 PlayerActivity =="
          python3 - <<'PYEOF'
          import zipfile, struct, sys

          def string_pool(data):
              off = 8
              while off < len(data):
                  ctype, csize, _ = struct.unpack('<HHI', data[off:off+8])
                  if ctype == 0x0001:
                      scount, _, flags, sstart, _ = struct.unpack('<IIIII', data[off+8:off+28])
                      utf8 = bool(flags & (1 << 8))
                      offs = [struct.unpack('<I', data[off+28+i*4:off+32+i*4])[0]
                              for i in range(scount)]
                      out, base = [], off + sstart
                      for o in offs:
                          p = base + o
                          if utf8:
                              n = data[p]; p += 1
                              if n & 0x80:
                                  n = ((n & 0x7f) << 8) | data[p]; p += 1
                              n2 = data[p]; p += 1
                              if n2 & 0x80:
                                  n2 = ((n2 & 0x7f) << 8) | data[p]; p += 1
                              out.append(data[p:p+n2].decode('utf-8', 'replace'))
                          else:
                              n = struct.unpack('<H', data[p:p+2])[0]; p += 2
                              if n & 0x8000:
                                  n = ((n & 0x7fff) << 16) | struct.unpack('<H', data[p:p+2])[0]; p += 2
                              out.append(data[p:p+n*2].decode('utf-16-le', 'replace'))
                      return out
                  off += csize
              return []

          z = zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk')
          strs = string_pool(z.read('AndroidManifest.xml'))
          target = 'com.giangnam728828.anime.universe.player.PlayerActivity'
          if target not in strs:
              print(f'❌ 合并后的 Manifest 未注册 {target}')
              print('可用字符串:', [s for s in strs if 'Activity' in s])
              sys.exit(1)
          print(f'✅ 合并后的 Manifest 已注册 {target}')

          # ★ 阻断性缺陷修复守卫（2026-11-04）
          #   主题属性在 AXML 中以「资源 ID」存储，不是字符串 —— 必须按 ID 判定：
          #     package 0x01 = android 框架资源（系统主题）→ 会触发 AppCompat 崩溃
          #     package 0x7f = 应用自有资源        （正确）
          #   旧错误写法 @android:style/Theme.Black.NoTitleBar.Fullscreen = 0x0103000a
          def parse_axml(data):
              off, pool, elems, guard = 8, [], [], 0
              while off + 8 <= len(data) and guard < 50000:
                  guard += 1
                  ctype, header_size, csize = struct.unpack('<HHI', data[off:off+8])
                  if csize < 8 or off + csize > len(data):
                      break
                  if ctype == 0x0001:
                      scount, _st, flags, sstart, _ = struct.unpack('<IIIII', data[off+8:off+28])
                      utf8 = bool(flags & (1 << 8))
                      offs = [struct.unpack('<I', data[off+28+i*4:off+32+i*4])[0] for i in range(scount)]
                      base = off + sstart
                      for o in offs:
                          p = base + o
                          if p >= len(data):
                              pool.append(''); continue
                          if utf8:
                              n = data[p]; p += 1
                              if n & 0x80:
                                  n = ((n & 0x7f) << 8) | data[p]; p += 1
                              n2 = data[p]; p += 1
                              if n2 & 0x80:
                                  n2 = ((n2 & 0x7f) << 8) | data[p]; p += 1
                              pool.append(data[p:p+n2].decode('utf-8', 'replace'))
                          else:
                              n = struct.unpack('<H', data[p:p+2])[0]; p += 2
                              if n & 0x8000:
                                  n = ((n & 0x7fff) << 16) | struct.unpack('<H', data[p:p+2])[0]; p += 2
                              pool.append(data[p:p+n*2].decode('utf-16-le', 'replace'))
                  elif ctype == 0x0102:  # START_ELEMENT
                      _ns, _nm = struct.unpack('<II', data[off+16:off+24])
                      attr_start, _asz, attr_count = struct.unpack('<HHH', data[off+24:off+30])
                      aoff = off + 16 + attr_start
                      attrs = []
                      for _ in range(attr_count):
                          if aoff + 20 > len(data):
                              break
                          ans, anm, araw, atyp, adata = struct.unpack('<IIIiI', data[aoff:aoff+20])
                          attrs.append({
                              'name': pool[anm] if anm < len(pool) else '',
                              'raw': pool[araw] if (araw != 0xFFFFFFFF and araw < len(pool)) else None,
                              'type': atyp, 'data': adata,
                          })
                          aoff += 20
                      elems.append({'name': pool[_nm] if _nm < len(pool) else '', 'attrs': attrs})
                  off += csize
              return elems

          elems = parse_axml(z.read('AndroidManifest.xml'))
          found = False
          for e in elems:
              if e['name'] != 'activity':
                  continue
              nm = next((a['raw'] for a in e['attrs'] if a['name'] == 'name' and a['raw']), '')
              if 'PlayerActivity' not in str(nm):
                  continue
              found = True
              th = next((a for a in e['attrs'] if a['name'] == 'theme'), None)
              if th is None:
                  print('❌ PlayerActivity 未声明 theme 属性')
                  sys.exit(1)
              data_v, typ = th['data'], th['type']
              pkg = (data_v >> 24) & 0xFF
              print(f'    theme: raw={th["raw"]!r} type=0x{typ:x} id=0x{data_v:08x} package=0x{pkg:02x}')
              if th['raw'] is not None and 'Theme.AnimeUniverse.Player' in str(th['raw']):
                  print('✅ PlayerActivity 主题指向自有主题 Theme.AnimeUniverse.Player')
              elif pkg == 0x7F:
                  print('✅ PlayerActivity 主题为应用自有资源（package 0x7f，非系统主题）')
              else:
                  print(f'❌ PlayerActivity 主题仍指向系统框架资源 0x{data_v:08x}（会导致 AppCompat 崩溃）')
                  print('   预期：应用自有主题（package 0x7f）')
                  sys.exit(1)
          if not found:
              print('❌ 未在合并 Manifest 中找到 PlayerActivity 节点')
              sys.exit(1)
          PYEOF

          echo "== 检查自有主题资源已进入 APK 资源表 =="
          python3 - <<'PYEOF'
          import zipfile, sys
          z = zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk')
          # resources.arsc 的字符串池编码可能是 UTF-8 也可能是 UTF-16，
          # 两种都探测（不能只假定一种，否则会误报）。来源名以 UTF-8 为主。
          arsc = z.read('resources.arsc')
          name = 'Theme.AnimeUniverse.Player'
          hit = (name.encode('utf-8') in arsc) or (name.encode('utf-16-le') in arsc)
          if hit:
              print(f'✅ resources.arsc 含 {name}（主题资源已编译进 APK）')
          else:
              print(f'❌ resources.arsc 未含 {name} —— 主题资源未进入 APK')
              sys.exit(1)
          PYEOF

          echo "== 检查测试素材进入 APK（v2：必须为原生可读的 assets/test.mp4）=="
          python3 - <<'PYEOF'
          import zipfile, sys
          z = zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk')
          names = z.namelist()
          hit = [n for n in names if n.endswith('test.mp4')]
          print('素材条目:', hit)

          # ★ v2 裁定：唯一权威素材 = assets/test.mp4（对应 asset:///test.mp4）
          REQUIRED = 'assets/test.mp4'
          if REQUIRED not in names:
              print(f'❌ APK 内缺少 {REQUIRED}（asset:///test.mp4 将无法读取）')
              sys.exit(1)
          size = z.getinfo(REQUIRED).file_size
          print(f'✅ {REQUIRED} 存在, size={size}')

          # 仅检查大小不够 —— 必须确认含真实可解码视频帧
          if size < 1024 * 1024:
              print(f'❌ {REQUIRED} 仅 {size} 字节，疑似空容器（历史踩坑：485 字节）')
              sys.exit(1)
          data = z.read(REQUIRED)
          for box in [b'moov', b'trak', b'stsd', b'avc1', b'mp4a']:
              if box not in data:
                  print(f'❌ {REQUIRED} 缺少 MP4 box: {box.decode()}')
                  sys.exit(1)
          print(f'✅ {REQUIRED} 含 moov/trak/stsd/avc1/mp4a（真实可解码视频+音轨）')
          PYEOF

          echo "== 检查前端素材 URI 使用 asset:/// 而非 window.location.origin =="
          python3 - <<'PYEOF'
          import re, sys
          src = open('src/modules/player/PlayerPage.tsx', encoding='utf-8').read()

          if "asset:///" not in src:
              print('❌ PlayerPage.tsx 未使用 asset:/// URI')
              sys.exit(1)
          print("✅ PlayerPage.tsx 使用 asset:/// URI")

          # 素材 URL 不得再依赖 window.location.origin（上一轮崩溃根因）
          bad_lines = []
          for i, line in enumerate(src.splitlines(), 1):
              stripped = line.strip()
              if stripped.startswith('//') or stripped.startswith('*'):
                  continue
              if 'window.location.origin' in stripped:
                  bad_lines.append((i, stripped))
          if bad_lines:
              print('❌ 代码中仍使用 window.location.origin 构造素材地址:')
              for i, l in bad_lines:
                  print(f'    line {i}: {l}')
              sys.exit(1)
          print('✅ 未在代码中使用 window.location.origin 构造素材地址')

          if not re.search(r"uriKind\s*:\s*'asset'", src):
              print("❌ 自检调用未声明 uriKind: 'asset'")
              sys.exit(1)
          print("✅ 自检调用已声明 uriKind: 'asset'")
          PYEOF

          echo "== 检查错误码与 URI 校验实现已落地 =="
          python3 - <<'PYEOF'
          import sys, os
          ts = open('native-plugins/media3-player/src/definitions.ts', encoding='utf-8').read()
          for code in ['MEDIA_RESOURCE_NOT_FOUND', 'MEDIA_FORMAT_INVALID']:
              if code not in ts:
                  print(f'❌ definitions.ts 缺少错误码 {code}')
                  sys.exit(1)
          print('✅ definitions.ts 含 v2 新增错误码')

          app_ts = open('src/services/playback/types.ts', encoding='utf-8').read()
          for code in ['MEDIA_RESOURCE_NOT_FOUND', 'MEDIA_FORMAT_INVALID']:
              if code not in app_ts:
                  print(f'❌ src/services/playback/types.ts 未同步错误码 {code}')
                  sys.exit(1)
          print('✅ 应用侧错误码已同步')

          vp = 'native-plugins/media3-player/android/src/main/java/com/giangnam728828/anime/universe/player/PlaybackUriValidator.kt'
          if not os.path.isfile(vp):
              print('❌ 缺少 PlaybackUriValidator.kt')
              sys.exit(1)
          vkt = open(vp, encoding='utf-8').read()
          for token in ['".."', 'URLDecoder', 'ALLOWED_SCHEMES']:
              if token not in vkt:
                  print(f'❌ 校验器缺少关键逻辑: {token}')
                  sys.exit(1)
          print('✅ URI 校验器含防穿越与白名单逻辑')

          pa = open('native-plugins/media3-player/android/src/main/java/com/giangnam728828/anime/universe/player/PlayerActivity.kt', encoding='utf-8').read()
          for token in ['ERROR_CODE_IO_FILE_NOT_FOUND', 'MEDIA_RESOURCE_NOT_FOUND',
                        'ERROR_CODE_PARSING_CONTAINER_MALFORMED', 'MEDIA_FORMAT_INVALID',
                        'errorCodeName']:
              if token not in pa:
                  print(f'❌ PlayerActivity.kt 缺少: {token}')
                  sys.exit(1)
          print('✅ PlayerActivity 错误映射含 v2 规则（保留原始 errorCodeName）')
          PYEOF

          echo "== 检查冻结模块与 AudioFocusHelper 未被修改 =="
          python3 - <<'PYEOF'
          import subprocess, sys
          FROZEN = [
              'src/services/sources/', 'src/modules/search/',
              'src/modules/detail/DetailPage.tsx', 'src/modules/news/',
              'src/modules/reader/', 'src/services/api/', 'src/database/',
          ]
          base = subprocess.run(['git', 'rev-parse', 'HEAD~1'],
                                capture_output=True, text=True).stdout.strip()
          r = subprocess.run(['git', 'diff', '--name-only', f'{base}..HEAD', '--'] + FROZEN,
                             capture_output=True, text=True)
          changed = [x for x in r.stdout.strip().splitlines() if x]
          if changed:
              print('❌ 冻结模块被修改:')
              for c in changed:
                  print('   ', c)
              sys.exit(1)
          print('✅ 冻结模块未被修改')

          afh = 'native-plugins/media3-player/android/src/main/java/com/giangnam728828/anime/universe/player/AudioFocusHelper.kt'
          r2 = subprocess.run(['git', 'diff', '--name-only', f'{base}..HEAD', '--', afh],
                              capture_output=True, text=True)
          if r2.stdout.strip():
              print('❌ AudioFocusHelper.kt 被修改（用户要求零改动）')
              sys.exit(1)
          print('✅ AudioFocusHelper.kt 零改动')
          PYEOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-universe-apk
          path: android/app/build/outputs/apk/release/app-release.apk
