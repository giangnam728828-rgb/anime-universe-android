name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # ★ 播放专项阶段1 · A4 验证(1)：插件依赖安装
      - name: Verify native plugin installed
        run: |
          echo "== 检查本地插件依赖 =="
          test -d node_modules/media3-player \
            || (echo "❌ media3-player 未安装"; exit 1)
          test -f node_modules/media3-player/android/build.gradle \
            || (echo "❌ 插件 android/build.gradle 缺失"; exit 1)
          test -f node_modules/media3-player/android/src/main/java/com/giangnam728828/anime/universe/player/Media3PlayerPlugin.kt \
            || (echo "❌ Kotlin 插件源缺失"; exit 1)
          echo "✅ media3-player 依赖安装正确"

      - name: Inject embedded translation key
        env:
          TRANS_API_KEY: ${{ secrets.TRANS_API_KEY }}
        run: |
          if [ -n "$TRANS_API_KEY" ]; then
            printf '// Auto-injected at build time from GitHub Secrets.\nexport const EMBEDDED_TRANS_KEY = "%s"\n' "$TRANS_API_KEY" > src/services/translate/embedded.ts
            echo "translation key injected"
          else
            echo "no TRANS_API_KEY secret, keep placeholder"
          fi

      - name: Build web assets
        run: npm run build

      - name: Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # ★ 播放专项阶段1 · A4 验证(1)：插件自动注册
      - name: Verify plugin auto-registration
        run: |
          echo "== 检查 Capacitor 自动注册 =="
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -f "$PLUGINS" || (echo "❌ capacitor.plugins.json 不存在"; exit 1)
          echo "--- capacitor.plugins.json ---"
          cat "$PLUGINS"
          grep -q "media3-player" "$PLUGINS" \
            || (echo "❌ Media3Player 未出现在自动注册清单"; exit 1)
          grep -q "Media3PlayerPlugin" "$PLUGINS" \
            || (echo "❌ Media3PlayerPlugin 类未注册"; exit 1)
          echo "✅ Media3Player 已自动注册"
          echo "== 检查 Kotlin 源已进入 Android 工程 =="
          find android -name "Media3PlayerPlugin.kt" | head -5
          find android -name "PlayerActivity.kt" | head -5

      - name: Generate anime app icons & splash
        run: |
          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android \
              --assetPath assets \
              --iconBackgroundColor "#0A0A0F" \
              --splashBackgroundColor "#0A0A0F"
          fi

      - name: Setup fixed signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore.p12
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore.p12
          storePassword=$KEYSTORE_PASSWORD
          storeType=PKCS12
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          python3 scripts/patch_signing.py "${{ github.run_number }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Release APK (fixed signature)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ★ 播放专项阶段1：注入 Kotlin Gradle Plugin（Capacitor 6 模板默认不含）
      - name: Inject Kotlin Gradle Plugin
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path('android/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'kotlin-gradle-plugin' in s:
              print('已注入，跳过')
              raise SystemExit(0)
          # 在 buildscript.dependencies 中加入 kotlin plugin classpath
          s = s.replace(
              "classpath 'com.android.tools.build:gradle:8.2.1'",
              "classpath 'com.android.tools.build:gradle:8.2.1'\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'",
              1,
          )
          p.write_text(s, encoding='utf-8')
          print('✅ Kotlin Gradle Plugin 已注入')
          PYEOF
          echo "--- 验证 ---"
          grep -n "kotlin-gradle-plugin" android/build.gradle

          # 把插件作为独立 module 引入
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/settings.gradle')
          s = p.read_text(encoding='utf-8')
          if "media3-player" in s:
              print('module 已引入，跳过')
              raise SystemExit(0)
          s = s.rstrip() + "\n\n// ★ 播放专项阶段1：本地 Media3 插件 module\n" \
              + "include ':media3-player'\n" \
              + "project(':media3-player').projectDir = new File(rootDir, '../node_modules/media3-player/android')\n"
          p.write_text(s, encoding='utf-8')
          print('✅ media3-player module 已引入 settings.gradle')
          PYEOF
          tail -5 android/settings.gradle

          # app 依赖该 module
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if "media3-player" in s:
              print('依赖已存在，跳过')
              raise SystemExit(0)
          s = s.rstrip() + "\n\ndependencies {\n    implementation project(':media3-player')\n}\n"
          p.write_text(s, encoding='utf-8')
          print('✅ app 已依赖 :media3-player')
          PYEOF

          # minSdk 22 -> 23（用户 A1 裁定）
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path('android/variables.gradle')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'minSdkVersion\s*=\s*22', 'minSdkVersion = 23', s)
          p.write_text(s2, encoding='utf-8')
          print('✅ minSdkVersion 22 -> 23' if s2 != s else '⚠️ minSdk 未变化，检查模板')
          PYEOF
          grep -n "minSdkVersion" android/variables.gradle

      # ★ 播放专项阶段1 · A4 验证(2)：原生构建产物验证
      - name: Verify native build artifacts
        run: |
          echo "== 检查 Media3 依赖进入构建 =="
          test -f android/app/build/outputs/apk/release/app-release.apk \
            || (echo "❌ APK 未生成"; exit 1)
          echo "== 检查 APK 内包含插件类 =="
          python3 - <<'PYEOF'
          import zipfile, sys
          z = zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk')
          names = z.namelist()
          dex = [n for n in names if n.endswith('.dex')]
          print(f'dex 文件数: {len(dex)}')
          # 检查 assets 中的测试素材
          assets = [n for n in names if 'test.mp4' in n]
          print(f'测试素材: {assets if assets else "未找到"}')
          # 用 strings 方式在 dex 里找插件类名
          found = False
          for n in dex:
              data = z.read(n)
              if b'Media3PlayerPlugin' in data or b'PlayerActivity' in data:
                  found = True
                  break
          if not found:
              print('❌ dex 中未找到 Media3PlayerPlugin / PlayerActivity')
              sys.exit(1)
          print('✅ 插件类已编入 dex')
          PYEOF
          echo "== 检查 APK minSdkVersion =="
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging \
            android/app/build/outputs/apk/release/app-release.apk | grep -E "sdkVersion|targetSdkVersion" || true
          echo "== 检查测试素材进入 APK =="
          python3 -c "
          import zipfile,sys
          z=zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk')
          hit=[n for n in z.namelist() if 'player-test' in n or 'test.mp4' in n]
          print('素材条目:', hit)
          if not hit:
              print('⚠️  未找到测试素材（若仅通过 Web 层加载，可忽略）')
          "

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-universe-apk
          path: android/app/build/outputs/apk/release/app-release.apk
