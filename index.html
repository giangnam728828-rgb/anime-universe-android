<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>动漫宇宙 | Anime Universe</title>
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('au_settings') || '{}')
      document.documentElement.dataset.theme = (s && s.state && s.state.theme) || 'dark'
    } catch (e) { document.documentElement.dataset.theme = 'dark' }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
