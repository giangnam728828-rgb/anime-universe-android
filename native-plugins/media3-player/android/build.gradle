// 播放专项阶段1 —— Media3 本地插件 Gradle 配置
// ★ 本文件位于仓库内（native-plugins/），android/ 为 CI 动态生成的构建产物
//
// ⚠️ Kotlin 支持说明：
//   Capacitor 6 的 android 模板默认不带 Kotlin Gradle Plugin（只有 AGP 8.2.1）。
//   本插件通过 `apply plugin: 'kotlin-android'` 自行启用，
//   并在 CI 中对根工程 buildscript 注入 kotlin 插件 classpath（见 workflow）。

ext {
    // 播放专项阶段1 基线版本（已核实 Google Maven 最新稳定版）
    media3Version = '1.11.1'
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.giangnam728828.anime.universe.player'
    // ★ Media3 1.11.1 AAR 元数据要求 minCompileSdk=36
    compileSdk 36

    defaultConfig {
        // ★ 用户 A1 裁定：minSdk 22 → 23（Media3 1.11.1 AAR 要求 minSdkVersion=23）
        //   影响：Android 5.1(API22) 及以下设备无法安装；API23(Android 6.0) 起支持
        minSdk 23
        // ★ targetSdk 保持 34（与 Media3 要求无关；Media3 只约束 compileSdk）
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ★ T1-F / T1-G：允许真实 Kotlin JVM 单元测试（PlaybackUriValidator 为纯 JVM 类）
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    // 真实 Kotlin 单元测试（在 CI 的 :media3-player:testDebugUnitTest 执行）
    testImplementation 'junit:junit:4.13.2'
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // 阶段1 仅核心：本地 MP4 播放
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // ★ 阶段2/3 需要 HLS 时才追加，不得提前引入：
    // implementation "androidx.media3:media3-exoplayer-hls:$media3Version"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    // ★ 与 CI 注入的 kotlin-gradle-plugin 版本保持一致
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"

    // ★ Capacitor 核心 API：由宿主的 capacitor-android 提供
    //   本地插件必须以 local project 引用宿主工程同款版本，
    //   否则 @CapacitorPlugin / Plugin / PluginMethod 无法解析
    compileOnly project(':capacitor-android')
}
