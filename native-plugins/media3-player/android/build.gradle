// 播放专项阶段1 —— Media3 本地插件 Gradle 配置
// ★ 本文件位于仓库内（native-plugins/），android/ 为 CI 动态生成的构建产物
//
// ⚠️ Kotlin 支持说明：
//   Capacitor 6 的 android 模板默认不带 Kotlin Gradle Plugin（只有 AGP 8.2.1）。
//   本插件通过 `apply plugin: 'kotlin-android'` 自行启用，
//   并在 CI 中对根工程 buildscript 注入 kotlin 插件 classpath（见 workflow）。

ext {
    // 播放专项阶段1 基线版本（已核实 Google Maven 最新稳定版）
    media3Version = '1.11.1'
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.giangnam728828.anime.universe.player'
    // ★ Media3 1.11.1 AAR 元数据要求 minCompileSdk=36
    compileSdk 36

    defaultConfig {
        // ★ 用户 A1 裁定：minSdk 22 → 23（Media3 1.11.1 AAR 要求 minSdkVersion=23）
        //   影响：Android 5.1(API22) 及以下设备无法安装；API23(Android 6.0) 起支持
        minSdk 23
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // 阶段1 仅核心：本地 MP4 播放
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // ★ 阶段2/3 需要 HLS 时才追加，不得提前引入：
    // implementation "androidx.media3:media3-exoplayer-hls:$media3Version"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    // ★ 与 CI 注入的 kotlin-gradle-plugin 版本保持一致
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}
